# More buffer between PipeWire and the USB sound card: the Raspberry Pi 3 shares one USB bus
# with Ethernet, small transfers arrive late now and then (crackling).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_*" } ]
    actions = {
      update-props = {
        api.alsa.headroom = 1024
      }
    }
  }
]
