# PipeWire-Echounterdrückung der Türstation (WebRTC). Erzeugt ec_source/ec_sink über der
# einzigen Soundkarte (USB-Stick; Onboard-Audio ist abgeschaltet).
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = false
      aec.args = {
        webrtc.high_pass_filter = true
        webrtc.noise_suppression = true
        webrtc.gain_control = true
        webrtc.extended_filter = true
      }
      capture.props  = { node.name = "ec_capture" node.passive = true }
      source.props   = { node.name = "ec_source" node.description = "Tuer Mikrofon (Echo-Cancel)" }
      sink.props     = { node.name = "ec_sink" node.description = "Tuer Lautsprecher (Echo-Cancel)" }
      playback.props = { node.name = "ec_playback" node.passive = true }
    }
  }
]
