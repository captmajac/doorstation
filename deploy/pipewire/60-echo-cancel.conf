# PipeWire echo cancellation of the door station (WebRTC). Creates ec_source/ec_sink on top
# of the only sound card (USB stick; onboard audio is disabled).
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = false
      aec.args = {
        webrtc.high_pass_filter = true
        webrtc.noise_suppression = true
        webrtc.gain_control = true
        webrtc.extended_filter = true
      }
      capture.props  = { node.name = "ec_capture" node.passive = true }
      source.props   = { node.name = "ec_source" node.description = "Door microphone (echo cancel)" }
      sink.props     = { node.name = "ec_sink" node.description = "Door speaker (echo cancel)" }
      playback.props = { node.name = "ec_playback" node.passive = true }
    }
  }
]
