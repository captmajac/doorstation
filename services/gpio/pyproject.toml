[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doorstation-gpio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["doorstation-common"]

[project.scripts]
doorstation-gpio = "doorstation_gpio.__main__:main"

[tool.setuptools]
packages = ["doorstation_gpio"]
