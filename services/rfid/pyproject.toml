[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doorstation-rfid"
version = "0.1.0"
requires-python = ">=3.11"
# Versionen wie kormax/apple-home-key-reader 9675407 (auf Raspberry Pi OS 13 geprüft)
dependencies = [
  "doorstation-common",
  "HAP-python==4.9.2",
  "cryptography==41.0.7",
  "nfcpy==1.0.4",
  "cbor2==5.4.6",
  "pyusb==1.2.1",
]

[project.scripts]
doorstation-rfid = "doorstation_rfid.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["doorstation_rfid*"]

[tool.setuptools.package-data]
"*" = ["vendor/**/*", "vendor/*"]
