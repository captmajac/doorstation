[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doorstation-sip"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["doorstation-common"]

[project.scripts]
doorstation-sip = "doorstation_sip.__main__:main"
doorstation-audio-init = "doorstation_sip.audio:main"

[tool.setuptools]
packages = ["doorstation_sip"]
