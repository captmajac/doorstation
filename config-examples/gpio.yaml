# Door station GPIO service - pins in BCM numbering (physical pin in brackets).
# Recommended wiring: button and reed contacts switch to GND (active: low, pull: up),
# the HC-SR501 motion sensor outputs 3.3 V on motion (active: high). See docs/hardware.md.
mqtt:
  host: localhost
  port: 1883
  prefix: doorstation
  heartbeat_s: 300          # repeat status every 5 min (heartbeat), 0 = off
chip: /dev/gpiochip0
inputs:
  # bell button (pin 21)
  bell:      { pin: 9,  kind: button, trigger: press, active: low,  pull: up,  debounce_ms: 50,  min_interval_s: 2,  ring: true, report_release: true }
  # HC-SR501 motion sensor (pin 26)
  motion:    { pin: 7,  kind: state,  active: high, pull: off, debounce_ms: 0,   min_interval_s: 10, states: [idle, motion] }
  # reed contact mail flap (pin 35)
  mail_flap: { pin: 19, kind: state,  active: low,  pull: up,  debounce_ms: 200, min_interval_s: 1,  states: [closed, open] }
  # reed contact mailbox door (pin 33)
  mail_door: { pin: 13, kind: state,  active: low,  pull: up,  debounce_ms: 200, min_interval_s: 1,  states: [closed, open] }
