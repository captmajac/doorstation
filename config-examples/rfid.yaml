# Door station RFID/Home Key service
mqtt:
  host: localhost
  port: 1883
  prefix: doorstation
  heartbeat_s: 300          # repeat status every 5 min (heartbeat), 0 = off
nfc_path: "tty:AMA0:pn532"         # PN532 on the UART (VCC to 5 V, see docs/hardware.md)
accessory_name: "Mailbox NFC Reader"
express: true                     # iPhone does not need to be unlocked
finish: silver                    # color of the Wallet card: silver | black | gold | tan
flow: fast                        # fast | standard | attestation
repeat_block_s: 3                 # report the same ID again only after a 3 s pause
feedback_sound: beep              # feedback sound via the sound service; empty = none
state_dir: /var/lib/doorstation/rfid
hap_port: 51926
