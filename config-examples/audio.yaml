# Door station audio - applied by doorstation-audio-init before every start of baresip.
# Show cards and control names:  sudo ./install.sh audio-info
card_match: "USB"            # part of the ALSA card name (never the card number, it changes)
playback_control: Headphone  # C-Media 0d8c:000c: "Headphone"; 0d8c:0014: "Speaker"
playback_percent: 80         # speaker level 0-100 %
capture_control: Mic
capture_percent: 50          # microphone level 0-100 %
auto_gain_control: false     # the stick's hardware gain control (true/false; ignored if the control is missing)
mic_playback: false          # microphone straight to the speaker (monitoring) - always keep off
echo_cancel:                 # PipeWire echo cancellation (fine tuning in deploy/pipewire/60-echo-cancel.conf)
  enabled: true
