# Door station SIP service (adapter between bell/home automation and baresip)
mqtt:
  host: localhost
  port: 1883
  prefix: doorstation
  heartbeat_s: 300          # repeat status every 5 min (heartbeat), 0 = off
fritzbox: 192.168.178.1          # Registrar
username: Tuerstation          # user name of the IP phone **629 - no umlauts!
                               # password: /etc/doorstation/secrets/sip_password
default_target: "**701"        # call target until one is set via set_target; null = muted
ring_timeout_s: 30             # hang up if nobody answers
max_call_s: 120                # maximum duration of every call
cooldown_s: 5                  # cooldown after a call
healthcheck_s: 30              # baresip polling interval
command_max_age_s: 30          # older call commands (ts) are dropped
# time_server: 192.168.178.1   # time server for the Pi (install.sh); default: fritzbox, null = system default
